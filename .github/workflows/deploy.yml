name: Deploy to Hosting NazwaGraha

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Auto Deploy to Hosting NazwaGraha
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Ambil Kode Terbaru
        uses: actions/checkout@v4

      - name: 📂 Sinkronisasi File ke Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.example
            phpunit.xml
